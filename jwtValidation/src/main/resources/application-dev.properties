server.port = 9090

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/authentication/**

spring.cloud.gateway.routes[1].id=placeNewOrder
spring.cloud.gateway.routes[1].uri=lb://PLACENEWORDER
spring.cloud.gateway.routes[1].predicates[0]=Path=/newOrder/**

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


eureka.client.service-url.defaultZone=http://localhost:8761/eureka